events {}

http {
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=status:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=6r/m;

    map $http_origin $cors_origin {
        default "";
        "~^https?://" $http_origin;
    }

    server {
        listen 80;

        # Login — strictest limit
        location /api/auth/google {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials true always;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Status polling — higher throughput for Telegram link polling
        location /api/auth/me {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=status burst=10 nodelay;
            limit_req_status 429;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials true always;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other API routes
        location /api/ {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Allow-Credentials true always;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Telegram webhook — expensive operations
        location /webhook/ {
            limit_req zone=webhook burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check — no limit
        location /health {
            proxy_pass http://backend:8080;
        }
    }
}
